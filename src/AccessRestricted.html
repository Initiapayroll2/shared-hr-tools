<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<style>
  body{ margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:#F3F5EF; color:#1C231F; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; }
  .card{ max-width:420px; margin:20px; background:#FFFFFF; border:1px solid #DBE1D5; border-radius:14px; padding:32px; text-align:center; box-shadow:0 1px 2px rgba(28,35,31,0.06), 0 4px 14px rgba(28,35,31,0.05); }
  h1{ font-size:1.25rem; margin:0 0 12px; }
  p{ color:#57635B; font-size:0.9rem; line-height:1.6; margin:0 0 8px; }
  .email{ font-weight:600; color:#1C231F; }
</style>
</head>
<body>
  <div class="card">
    <h1>Access restricted</h1>
    <p>This org chart is limited to approved Super Admins and Viewers, to protect employee photos and personal details.</p>
    <p>You're signed in as <span class="email"><?= email ?></span>. If you should have access, ask an admin to add this exact email under Manage Access.</p>
  </div>
</body>
</html>
